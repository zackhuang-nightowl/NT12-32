# ============================================================================
#  rsdk_features.conf —— 录像 SDK 统一配置(单一真源)
#  固件编译前配置; 由 tools/gen_config.py 生成 include/rsdk_config.h 编译进固件。
#  由特性控制模块 rsdk_feature 统一读取(设计 §13)。
# ============================================================================

[features]
encryption        = on      # 录像负载 AES-256-CTR(设计 §5); off=明文
encryption_hw     = on      # 优先 /dev/crypto mc-aes, 失败软件 AES
metadata          = on      # 元数据子系统(设计 §12); off=不建库/不预留 MetaRegion
multidisk_balance = on      # 多盘负载均衡(设计 §4); off=单盘
backup_fmp4       = off      # fMP4 导出(设计 §8, 后续)

[layout]
chunk_mib         = auto     # 数据 chunk 大小; auto=按盘容量(<8GiB→8, ≤4TB→256, ≤16TB→512, 更大→1024;行业量级)
slots_per_chunk   = 4        # 段索引密度因子(决定段索引区大小, 冻结 §1.1)
evt_slots_per_chunk = 64     # 事件索引密度因子(决定事件索引区大小/事件容量; 128B/槽)
rsv_mib           = 0        # 保留区下限兜底; 0=全自动(按盘容量算)
meta_ratio_pct    = 3.0      # metadata=on 时 MetaRegion(截图环) 占盘容量比例; 20MP 截图较大故取 3%
hdd_full          = overwrite # 满盘策略: overwrite(循环覆盖最旧+回收旧索引) | stop(停录)

[crypto]
cipher            = aes-256-ctr
kek_source        = device_sn # KEK 派生源(工厂区 SN)

[metadata]
store             = hybrid    # hybrid(DB+MetaRegion) | nofs
inline_max_kb     = 4         # JSON ≤此值 inline 到 DB; 超则落 MetaRegion(storage=1)
gzip              = on        # MetaRegion JSON 是否 gzip(mdoc.enc bit1)
db_path           = /config/meta.db   # 文档索引库(受保护小 FS 分区)
# 需"智能检索深查"的 JSON 路径 → 自动建 SQLite 表达式索引(读取侧 json_extract 加速)
# 写入侧仍不解析内容; 这里只声明"哪些字段将来要查"
index_paths       = $.objects[0].cls, $.objects[0].color, $.objects[0].plate, $.objects[0].face_id, $.event
fts               = off       # 是否对 json 建 FTS5 全文索引(模糊/全文检索; 占空间)
